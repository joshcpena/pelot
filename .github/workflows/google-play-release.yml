name: Google Play Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  submit-android:
    name: Build and Submit Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_MAPTILER_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPTILER_API_KEY }}
      EXPO_PUBLIC_OPENROUTESERVICE_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENROUTESERVICE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo doctor
        run: npx expo-doctor

      - name: Write Google Play service account
        run: |
          printf '%s' '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > google-service-account.json
          test -s google-service-account.json

      - name: Build Android app bundle
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit latest Android build to Google Play
        run: eas submit --platform android --profile production --latest --non-interactive
